<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汇报工坊 · 周报转 PPT</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 9h8m-8 4h5"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m3-11h5m-5 4h5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8m-8 4h6"/></symbol>
    <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5H4l1.8-4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M9 11.5h7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Zm7 13v6m-3-3h6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m14 6 4 4M4 20l4.5-1 11-11a2.8 2.8 0 0 0-4-4l-11 11L4 20Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M9 3h6m-3 0v18m-3 0h6M4 8V6h3m13 2V6h-3M4 16v2h3m13-2v2h-3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M21 11.2c0 2.2-1.7 3.3-3.4 3.3H15a1.5 1.5 0 0 0-1.1 2.5 1.8 1.8 0 0 1-1.4 3C7.3 20 3 16.3 3 11.7 3 7 7 3.5 12 3.5s9 3.3 9 7.7Z"/><path d="M7.5 11h.01M9.5 7.7h.01m4.2-.4h.01m3.5 2.2h.01" stroke-width="2.6"/></symbol>
  </svg>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
      <h1>汇报工坊</h1>
    </div>
    <div class="project-heading"><svg class="icon"><use href="#i-right"/></svg><span id="project-name"></span></div>
    <div class="top-actions">
      <span class="mode" id="mode">交互演示</span>
      <button type="button" class="button subtle top-history" id="open-projects"><svg class="icon"><use href="#i-clock"/></svg>历史</button>
      <button type="button" class="button outline top-new" id="start-project"><svg class="icon"><use href="#i-plus"/></svg>新建汇报</button>
      <button type="button" class="button dark" id="download"><svg class="icon"><use href="#i-download"/></svg>导出 PPTX</button>
    </div>
  </header>
  <main class="app">
    <aside class="slide-rail" aria-labelledby="slides-title">
      <div class="rail-heading">
        <div class="heading-label"><svg class="icon"><use href="#i-layout"/></svg><h2 id="slides-title">幻灯片</h2><span class="counter" id="slides-count"></span></div>
      </div>
      <ol id="thumbnails" class="thumbnails"></ol>
      <div class="rail-footer">
        <button type="button" class="button subtle source-button" id="open-source"><svg class="icon"><use href="#i-doc"/></svg>原始周报<svg class="icon caret"><use href="#i-right"/></svg></button>
        <button type="button" class="button subtle source-button" id="open-template"><svg class="icon"><use href="#i-palette"/></svg><span id="template-label">演示模板</span><svg class="icon caret"><use href="#i-right"/></svg></button>
      </div>
    </aside>
    <section class="workspace" aria-labelledby="preview-title">
      <div class="workspace-toolbar">
        <div>
          <div class="workspace-title"><h2 id="preview-title">演示稿预览</h2><span id="deck-meta"></span></div>
          <p><svg class="icon"><use href="#i-select"/></svg>划选文字或点选内容块，留下修改意见</p>
        </div>
        <button class="button outline" type="button" id="page-comment"><svg class="icon"><use href="#i-comment"/></svg>整页批注</button>
      </div>
      <div class="stage">
        <div class="canvas-frame">
          <div id="slide" aria-label="当前幻灯片"></div>
          <div class="canvas-tools">
            <div class="pagination">
              <button class="icon-button" type="button" id="previous" aria-label="上一页"><svg class="icon"><use href="#i-left"/></svg></button>
              <span id="position" aria-live="polite"></span>
              <button class="icon-button" type="button" id="next" aria-label="下一页"><svg class="icon"><use href="#i-right"/></svg></button>
            </div>
            <button class="button subtle" type="button" id="edit"><svg class="icon"><use href="#i-pencil"/></svg>手动编辑</button>
          </div>
        </div>
      </div>
    </section>
    <aside class="review" aria-labelledby="review-title">
      <div class="review-header">
        <div class="heading-label"><svg class="icon"><use href="#i-comment"/></svg><h2 id="review-title">审稿批注</h2></div>
        <button type="button" id="example" class="text-button">恢复示例</button>
      </div>
      <div class="review-tabs" aria-label="批注状态">
        <button type="button" aria-pressed="true" id="pending-tab">待处理 <span id="pending-count"></span></button>
        <button type="button" aria-pressed="false" id="history-tab">已应用 <span id="history-count"></span></button>
      </div>
      <div class="review-body">
        <form id="comment-form" class="compose" hidden>
          <div class="compose-head"><strong id="compose-target"></strong><button class="icon-button" id="close-compose" type="button" aria-label="取消批注"><svg class="icon"><use href="#i-close"/></svg></button></div>
          <blockquote id="compose-quote"></blockquote>
          <label class="sr-only" for="comment-text">修改意见</label>
          <textarea id="comment-text" rows="3" required maxlength="400" placeholder="例如，把这句话改成一句明确的结论"></textarea>
          <button class="button primary" type="submit"><svg class="icon"><use href="#i-plus"/></svg>添加批注</button>
        </form>
        <div id="review-list"></div>
      </div>
      <div class="review-footer">
        <button type="button" class="button primary" id="revise"><svg class="icon"><use href="#i-spark"/></svg><span id="revise-label"></span></button>
        <p id="review-hint"></p>
        <p id="model-usage" hidden></p>
      </div>
    </aside>
  </main>
  <p class="toast" id="feedback" role="status" hidden></p>
  <dialog id="source-dialog" aria-labelledby="settings-title">
    <form id="generate-form">
      <div class="dialog-head"><div><h2 id="settings-title">原始周报</h2><p>粘贴材料，生成一份新稿。旧稿可从历史继续编辑。</p></div><button class="icon-button close-dialog" type="button" aria-label="关闭原始周报"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <label for="source">周报或项目笔记</label>
      <textarea id="source" required maxlength="6000" rows="10" placeholder="粘贴你的周报…" spellcheck="false"></textarea>
      <div class="source-meta"><button id="sample" type="button" class="text-button">填入示例周报</button><output id="source-count" for="source"></output></div>
      <div class="form-row">
        <label>汇报对象<select id="audience"><option>导师 / 项目负责人</option><option>项目团队</option><option>客户 / 合作方</option></select></label>
        <label>页数<select name="slide-count" id="slide-count"><option value="5">5 页</option><option value="6">6 页</option><option value="8">8 页</option></select></label>
      </div>
      <p class="dialog-feedback" id="source-feedback" role="status" hidden></p>
      <div class="dialog-actions"><button class="button primary" id="generate" type="submit"><svg class="icon"><use href="#i-spark"/></svg><span id="generate-label">生成初稿</span></button></div>
    </form>
  </dialog>
  <dialog id="projects-dialog" aria-labelledby="projects-title">
    <div class="dialog-head">
      <div><h2 id="projects-title">汇报历史</h2><p id="projects-hint">打开过去的汇报，继续编辑和批注。</p></div>
      <button class="icon-button close-dialog" type="button" aria-label="关闭历史"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div id="project-list" aria-live="polite"></div>
    <div class="dialog-actions"><button type="button" class="button primary" id="new-project"><svg class="icon"><use href="#i-plus"/></svg>新建汇报</button></div>
  </dialog>
  <dialog id="template-dialog" aria-labelledby="template-title">
    <div class="dialog-head">
      <div><h2 id="template-title">演示模板</h2><p>从已有 PPTX 提取主题配色和字体，应用到预览及导出。</p></div>
      <button class="icon-button close-dialog" type="button" aria-label="关闭演示模板"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="template-preview">
      <div id="template-colors" class="template-colors" aria-hidden="true"></div>
      <div><strong id="template-name"></strong><p id="template-font"></p></div>
    </div>
    <p class="template-help">按汇报内容自动排版。可用 PowerPoint 或 WPS 将常用模板另存为 .pptx 后导入。</p>
    <input type="file" accept=".pptx" class="sr-only" id="template-file" tabindex="-1">
    <p class="dialog-feedback" id="template-feedback" role="status" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="button outline" id="reset-template">恢复默认</button>
      <button type="button" class="button primary" id="import-template"><svg class="icon"><use href="#i-plus"/></svg>上传 PPTX 模板</button>
    </div>
  </dialog>
  <dialog id="editor" aria-labelledby="edit-title">
    <form id="edit-form">
      <div class="dialog-head"><h2 id="edit-title">编辑幻灯片</h2><button class="icon-button close-dialog" type="button" aria-label="关闭编辑"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <label for="edit-layout">版式</label>
      <select id="edit-layout"><option value="cover">封面</option><option value="points">要点列表</option><option value="grid">分栏卡片</option><option value="closing">结语</option></select>
      <label for="edit-slide-title">标题</label><input id="edit-slide-title" maxlength="42" required>
      <label for="edit-summary">一句话摘要</label><input id="edit-summary" maxlength="68">
      <label for="edit-points">内容要点，每行一条</label><textarea id="edit-points" rows="4"></textarea>
      <p class="dialog-feedback" id="edit-feedback" role="status" hidden></p>
      <div class="dialog-actions"><button class="button outline close-dialog" type="button">取消</button><button class="button primary" type="submit">保存修改</button></div>
    </form>
  </dialog>
</body>
</html>
